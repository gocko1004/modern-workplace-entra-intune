rivilege"}, {"a": "svc-graph", "b": "h-users", "l": "bulk creation", "r": "created through"}], "ui": {"kicker": "Entra ID and Intune · trial tenant, not production", "title": "My tenant, level by level", "next": "Next", "prev": "Back", "reset": "Collapse all", "repo": "GitHub repo", "principle": "The principle", "say": "In one line", "under": "Underneath", "what": "What it is", "setup": "How it is set up", "why": "Why", "gap": "Open point", "links": "Connected to", "shots": "Screenshots in the repo", "hint": "Click a box to open the next level.", "step": "Step", "of": "of", "kinds": {"user": "User", "group": "Group", "role": "Role", "policy": "Policy", "method": "Authentication method", "device": "Device", "intune": "Intune", "service": "Service", "licence": "Licence", "tool": "Tool", "log": "Log", "host": "Host machine"}, "gone": "Torn down", "start": "Start", "intro": "Read the tenant from the top down: each click opens the next level and explains why it is built that way. 'Next' follows the order of the presentation; Escape collapses everything.", "introProof": "The image icon marks the boxes backed by screenshots from the tenant: click a screenshot to see it full size.", "proof": "Proof", "shot1": "screenshot", "shotsN": "screenshots", "enlarge": "Click to enlarge", "lbPrev": "Previous", "lbNext": "Next", "zoom": "Zoom", "fit": "Fit", "orig": "Original on GitHub", "close": "Close", "loading": "Loading…", "failed": "Image unavailable: open the original on GitHub."}, "repo": "https://github.com/gocko1004/modern-workplace-entra-intune", "shots": {"01": {"step": "Step 3 · Never lose access", "what": "A sign-in authenticated with a <b>Temporary Access Pass<\/b>", "why": "How an account with no methods gets its first strong one, to register a passkey", "alt": "A sign-in authenticated with a Temporary Access Pass"}, "02": {"step": "Step 3 · Never lose access", "what": "Emergency account with one usable method, a <b>passkey<\/b>; system-preferred method Fido2", "why": "<b>Authenticator had also added push and codes<\/b>, both phishable. Removed", "alt": "Emergency account with one usable method, a passkey; system-preferred method Fido2"}, "03": {"step": "Step 3 · Never lose access", "what": "The passkey's AAGUID", "why": "The value Authenticator on Android reports. Graph records this passkey as attested; the profile does not require it, so an unattested passkey would also have been accepted", "alt": "The passkey's AAGUID"}, "04": {"step": "Step 4 · Access rules", "what": "Conditional Access policies page on its Get Started screen: no policies", "why": "The Day 15 policy was gone after the teardown, and nothing replaced it", "alt": "Conditional Access policies page on its Get Started screen: no policies"}, "05": {"step": "Step 4 · Access rules", "what": "Security defaults <b>Disabled<\/b>", "why": "With no policy either, <b>nothing required MFA for users<\/b>, a month after Day 15 recorded the gap", "alt": "Security defaults Disabled"}, "06": {"step": "Step 4 · Access rules", "what": "\"Don't lock yourself out!\" with <b>Exclude current user<\/b> pre-selected", "why": "Microsoft's safeguard, wrong here: the emergency account is the safeguard, and the default would exempt the daily admin from MFA", "alt": "\"Don't lock yourself out!\" with Exclude current user pre-selected"}, "07": {"step": "Step 4 · Access rules", "what": "What If result for the test user: CA001 and CA003 apply, report-only", "why": "Simulated before anything was switched on. Inputs are listed on the page", "alt": "What If result for the test user: CA001 and CA003 apply, report-only"}, "08": {"step": "Step 4 · Access rules", "what": "What If result for the emergency account: no policy applies, reason <b>Users and groups<\/b>", "why": "The exclusion holds for all three policies", "alt": "What If result for the emergency account: no policy applies, reason Users and groups"}, "09": {"step": "Step 4 · Access rules", "what": "Report-only results on a real Microsoft Edge sign-in: CA001 and CA003 Success, CA002 Not applied", "why": "<b>Found in the non-interactive log<\/b>, not the interactive one", "alt": "Report-only results on a real Microsoft Edge sign-in: CA001 and CA003 Success, CA002 Not applied"}, "10": {"step": "Step 4 · Access rules", "what": "CA001, CA002 and CA003, all three <b>On<\/b>", "why": "Switched on only after What If and the report-only sign-in agreed", "alt": "CA001, CA002 and CA003, all three On"}, "11": {"step": "Step 5 · The workstation", "what": "Choose MDM Authority set to <b>None<\/b>", "why": "<b>Error 80180003<\/b>, \"not authorized to enroll\". The tenant had never declared which service manages devices, so every enrolment was refused. The error blames the user; the user was never the problem", "alt": "Choose MDM Authority set to None"}, "12": {"step": "Step 5 · The workstation", "what": "<code>Dyn-Autopilot-Devices<\/code> with the lab VM as its member", "why": "<b>Profile stayed Not assigned<\/b> while it targeted <code>Dyn-Windows-Devices<\/code>: <code>deviceOSType<\/code> only matches enrolled devices. The ZTDid rule matches at registration", "alt": "Dyn-Autopilot-Devices with the lab VM as its member"}, "13": {"step": "Step 5 · The workstation", "what": "Deployment profile <code>APUserDrivenEntraJoin<\/code>: User-Driven, Microsoft Entra joined", "why": "User-driven because self-deploying mode needs a physical TPM 2.0", "alt": "Deployment profile APUserDrivenEntraJoin: User-Driven, Microsoft Entra joined"}, "14": {"step": "Step 5 · The workstation", "what": "<code>CORP-97322<\/code> in the Intune encryption report", "why": "The name comes from the profile's template <code>CORP-%RAND:5%<\/code>, proof the profile drove setup", "alt": "CORP-97322 in the Intune encryption report"}, "15": {"step": "Step 5 · The workstation", "what": "<code>CP-Windows<\/code> per setting: nine settings Compliant, 0 Not applicable", "why": "A Not applicable line was never checked. Zero means every check actually ran", "alt": "CP-Windows per setting: nine settings Compliant, 0 Not applicable"}, "16": {"step": "Step 5 · The workstation", "what": "<code>edge://policy<\/code>: four SmartScreen policies true, Platform, Device, Mandatory, OK", "why": "The download switch belongs to Edge, so the Defender policy could not set it", "alt": "edge://policy: four SmartScreen policies true, Platform, Device, Mandatory, OK"}, "17": {"step": "Step 6 · Check, don't assume", "what": "PowerShell audit: all three policies exclude the <b>user<\/b> Emergency Access 01, no group", "why": "<b>What If could not show this.<\/b> The protected group did nothing until the policies named it", "alt": "PowerShell audit: all three policies exclude the user Emergency Access 01, no group"}, "18": {"step": "Step 6 · Check, don't assume", "what": "The same check after the fix: all three exclude the group <code>EmergencyAccess<\/code>", "why": "Fix verified by re-reading, not assumed", "alt": "The same check after the fix: all three exclude the group EmergencyAccess"}, "19": {"step": "Step 6 · Check, don't assume", "what": "Emergency account sign-ins with the method used", "why": "<b>The passkey sits on the error 50140 entry<\/b>, the \"Stay signed in?\" prompt, not on the success after it", "alt": "Emergency account sign-ins with the method used"}, "20": {"step": "Step 6 · Check, don't assume", "what": "Test user sign-ins, and app registrations holding client secrets", "why": "Windows Hello for Business explains CA001's report-only success. No client secrets on app registrations", "alt": "Test user sign-ins, and app registrations holding client secrets"}, "21": {"step": "Step 6 · Check, don't assume", "what": "Portal: \"You do not have access to view this BitLocker recovery key\"", "why": "<b>Wrong error.<\/b> The account was Global Administrator. The portal blade failed, not the permission", "alt": "Portal: \"You do not have access to view this BitLocker recovery key\""}, "22": {"step": "Step 6 · Check, don't assume", "what": "Graph Explorer: 403 Forbidden on <code>recoveryKeys<\/code>", "why": "Graph needs <code>BitlockerKey.ReadBasic.All<\/code> and <code>BitlockerKey.Read.All<\/code> consented", "alt": "Graph Explorer: 403 Forbidden on recoveryKeys"}, "23": {"step": "Step 6 · Check, don't assume", "what": "Graph Explorer: 200 OK on the same endpoint", "why": "The API returned what the portal refused. The interface is only a client of the API", "alt": "Graph Explorer: 200 OK on the same endpoint"}, "24": {"step": "Step 6 · Check, don't assume", "what": "Three recovery keys listed for one drive", "why": "Not a fault. Every encryption and every rotation escrows a new key and the old ones stay, which is why the recovery screen shows a Key ID", "alt": "Three recovery keys listed for one drive"}, "25": {"step": "Step 6 · Check, don't assume", "what": "Antivirus policy with <b>PUA Protection off<\/b>", "why": "<b>Insecure value enforced.<\/b> An explicit \"off\" overrides the device and still reports as applied. Fixed by setting it to block", "alt": "Antivirus policy with PUA Protection off"}, "26": {"step": "Step 7 · Tear down and rebuild", "what": "Policy <code>Feature-Pin-24H2<\/code>, Versions column <b>Windows 11, version 25H2<\/b>", "why": "<b>Name did not match behaviour.<\/b> The name was a label typed by a human; the Versions column is what the service does", "alt": "Policy Feature-Pin-24H2, Versions column Windows 11, version 25H2"}, "27": {"step": "Step 7 · Tear down and rebuild", "what": "Each merge setting listed twice as <b>Conflict<\/b>, Default Inbound Action Succeeded", "why": "<b>Policy did nothing.<\/b> An older profile set the merge switches to True, the new one to False, so Windows applied neither. Fixed by giving the firewall one owner", "alt": "Each merge setting listed twice as Conflict, Default Inbound Action Succeeded"}, "28": {"step": "Step 7 · Tear down and rebuild", "what": "What If: <code>CA-Require-Compliant-Device<\/code> under Policies that will a     crumbs.innerHTML = path.map(function (id, i) {
      return '<button type="button" class="crumb" data-depth="' + i + '" data-id="' + id + '"' + (i === path.length - 1 ? ' aria-current="step"' : "") + ">" + esc(info(id).label) + "</button>";
    }).join('<span class="sep" aria-hidden="true">›</span>') + '<span class="hint">' + esc(D.ui.hint) + "</span>";
  }

  /* ---------- the panel ---------- */
  function sec(mark, title, body) { return '<div class="p-sec"><span class="mono"><em>' + mark + "</em>" + esc(title) + "</span>" + body + "</div>"; }
  function proofBlock(id) {
    var list = proofOf(id); if (!list.length) return "";
    return '<div class="proof"><div class="proof-h mono">' + ICON.image + "<span>" + esc(D.ui.proof) + " · " + list.length + " " + esc(shotWord(list.length)) + '</span><span class="proof-hint">' + esc(D.ui.enlarge) + '</span></div><div class="thumbs">' +
      list.map(function (n, i) {
        var m = SM[n], c = D.shots[n] || {};
        return '<button type="button" class="thumb" data-proof="' + id + '" data-i="' + i + '" aria-label="' + esc(n + " · " + (c.alt || "")) + '"><img src="' + esc(BASE + "thumbs/" + n + ".webp") + '" width="' + m.tw + '" height="' + m.th + '" loading="lazy" decoding="async" alt=""><span class="tn">' + n + "</span></button>";
      }).join("") + "</div></div>";
  }
  function renderPanel(id) {
    var U = D.ui, h = "";
    if (isLevel(id)) {
      var l = D.levels[id], kids = TREE[id] || [];
      h += '<div class="p-kind"><span class="chip">' + esc(l.sub || "") + '</span><span class="chip ok">' + kids.length + " ▾</span></div><h2>" + esc(l.label) + "</h2>";
      h += proofBlock(id);
      h += sec("(P)", U.principle, "<p>" + esc(l.principle) + "</p>");
      if (l.say) h += sec(lang.toUpperCase(), U.say, '<p class="p-say">' + esc(l.say) + "</p>");
      h += sec("(↓)", U.under, '<div class="links">' + kids.map(function (k) { var f = info(k); return '<button type="button" class="link" data-go="' + k + '"><b>' + esc(f.label) + "</b><span>" + esc(f.sub) + "</span></button>"; }).join("") + "</div>");
    } else {
      var n = D.nodes[id];
      h += '<div class="p-kind"><span class="chip">' + esc(U.kinds[n.kind] || n.kind) + "</span>" + (n.state ? '<span class="chip ' + esc(n.stateK) + '">' + esc(n.state) + "</span>" : "") + (n.gone ? '<span class="chip">' + esc(U.gone) + "</span>" : "") + "</div><h2>" + esc(n.label) + "</h2>";
      h += proofBlock(id);
      if (n.what) h += sec("(A)", U.what, "<p>" + esc(n.what) + "</p>");
      if (n.setup && n.setup.length) h += sec("(B)", U.setup, "<ul>" + n.setup.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul>");
      if (n.why) h += sec("(C)", U.why, "<p>" + esc(n.why) + "</p>");
      if (n.gap) h += '<div class="p-gap"><span class="mono">' + esc(U.gap) + "</span><p>" + esc(n.gap) + "</p></div>";
      var links = D.edges.map(function (e) {
        if (e.a !== id && e.b !== id) return "";
        var other = e.a === id ? e.b : e.a, lab = e.a === id ? e.l : e.r;
        if (!D.nodes[other] || !chainTo(other)) return "";
        return '<button type="button" class="link" data-go="' + other + '"><b>' + esc(D.nodes[other].label) + "</b><span>" + esc(lab) + "</span></button>";
      }).join("");
      if (links) h += sec("(D)", U.links, '<div class="links">' + links + "</div>");
      if (!PROOF && n.shots && n.shots.length) h += sec("(E)", U.shots, '<div class="shots">' + n.shots.map(function (s) { return '<a class="shot" href="' + esc(s.u) + '" target="_blank" rel="noopener"><span class="sn">' + esc(s.n) + '</span><span class="sf">' + esc(s.f) + "</span></a>"; }).join("") + "</div>");
    }
    if (seqPos >= 0) h = '<div class="p-step mono">' + esc(D.ui.step) + " " + (seqPos + 1) + " " + esc(D.ui.of) + " " + SEQ.length + "</div>" + h;
    panel.innerHTML = h;
    panel.scrollTop = 0;
  }

  /* ---------- a screenshot at full size: arrows, swipe, zoom to 100 % ---------- */
  var lb = document.getElementById("lb"), lbList = [], lbI = 0, lbFrom = null, swiped = false;
  function $(id) { return document.getElementById(id); }
  function lbShow(i) {
    if (i < 0 || i >= lbList.length) return;
    lbI = i;
    var n = lbList[i], m = SM[n], c = D.shots[n] || {}, U = D.ui, img = $("lb-img");
    lb.classList.remove("zoomed", "err"); lb.classList.add("loading");
    $("lb-step").textContent = c.step || "";
    $("lb-count").textContent = n + " · " + (i + 1) + " / " + lbList.length;
    $("lb-what").innerHTML = c.what || "";
    $("lb-why").innerHTML = c.why || ""; $("lb-why").hidden = !c.why;
    $("lb-orig").href = m.u; $("lb-orig").textContent = U.orig + " ↗";
    $("lb-msg").textContent = U.loading;
    $("lb-zoom").textContent = U.zoom; $("lb-zoom").disabled = true;
    $("lb-prev-t").textContent = U.lbPrev; $("lb-next-t").textContent = U.lbNext;
    lb.querySelector('[data-lb="prev"]').disabled = i === 0;
    lb.querySelector('[data-lb="next"]').disabled = i === lbList.length - 1;
    lb.querySelector('[data-lb="close"]').setAttribute("aria-label", U.close);
    $("lb-stage").scrollTop = $("lb-stage").scrollLeft = 0;
    img.onload = function () { if (lbList[lbI] !== n) return; lb.classList.remove("loading"); fitCheck(); };
    img.onerror = function () { lb.classList.remove("loading"); lb.classList.add("err"); $("lb-msg").textContent = U.failed; };
    img.alt = c.alt || ""; img.width = m.w; img.height = m.h;
    img.src = BASE + m.f;
    if (img.complete && img.naturalWidth) img.onload();
    [i - 1, i + 1].forEach(function (j) { if (j >= 0 && j < lbList.length) new Image().src = BASE + SM[lbList[j]].f; });
  }
  /* zoom only when the screenshot is bigger than the space it is shown in */
  function fitCheck() {
    var img = $("lb-img"), st = $("lb-stage");
    var big = img.naturalWidth > st.clientWidth - 24 || img.naturalHeight > st.clientHeight - 24;
    $("lb-zoom").disabled = !big;
    lb.classList.toggle("fits", !big);
  }
  function zoom(on, ev) {
    var img = $("lb-img"), st = $("lb-stage");
    if (on && $("lb-zoom").disabled) return;
    var r = img.getBoundingClientRect(), fx = ev ? (ev.clientX - r.left) / r.width : 0.5, fy = ev ? (ev.clientY - r.top) / r.height : 0.5;
    lb.classList.toggle("zoomed", on);
    $("lb-zoom").textContent = on ? D.ui.fit : D.ui.zoom;
    if (on) { st.scrollLeft = fx * img.naturalWidth - st.clientWidth / 2; st.scrollTop = fy * img.naturalHeight - st.clientHeight / 2; }
  }
  function lbOpen(id, i, from) {
    lbList = proofOf(id); lbFrom = from;
    document.documentElement.classList.add("lb-open");
    lb.showModal();
    lbShow(i);
  }
  function lbClose() { lb.close(); }
  if (lb) {
    lb.addEventListener("close", function () {
      document.documentElement.classList.remove("lb-open"); lb.classList.remove("zoomed");
      if (lbFrom && lbFrom.isConnected) lbFrom.focus();
    });
    var st = $("lb-stage"), sx = null, sy = 0;
    st.addEventListener("pointerdown", function (e) {
      swiped = false;
      sx = e.isPrimary && !lb.classList.contains("zoomed") ? e.clientX : null; sy = e.clientY;
    });
    st.addEventListener("pointerup", function (e) {
      if (sx === null || !e.isPrimary) return;
      var dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { swiped = true; lbShow(lbI + (dx < 0 ? 1 : -1)); }
    });
    st.addEventListener("pointercancel", function () { sx = null; });
    window.addEventListener("resize", function () { if (lb.open && !lb.classList.contains("loading")) fitCheck(); });
  }

  /* ---------- navigation ---------- */
  function openAt(depth, id) {
    var before = path.length;
    path = path.slice(0, depth); path[depth] = id;
    render(Math.min(depth + 1, before));
  }
  function goTo(id, fromSeq) {
    var c = chainTo(id); if (!c) return;
    if (!fromSeq) seqPos = SEQ.indexOf(id) >= 0 ? SEQ.indexOf(id) : seqPos;
    var keep = 0; while (keep < c.length && path[keep] === c[keep]) keep++;
    path = c; render(keep);
  }
  function step(d) {
    var n = seqPos + d; if (n < 0 || n >= SEQ.length) return;
    seqPos = n; goTo(SEQ[n], true);
  }
  function reset() { seqPos = -1; path = []; render(1); }

  document.addEventListener("click", function (e) {
    if (lb && lb.open) {
      if (e.target === lb) return lbClose();  /* a click on the dark backdrop */
      var a = e.target.closest("[data-lb]");
      if (a) {
        var k = a.dataset.lb;
        if (k === "close") lbClose(); else if (k === "prev") lbShow(lbI - 1); else if (k === "next") lbShow(lbI + 1); else if (k === "zoom") zoom(!lb.classList.contains("zoomed"));
        return;
      }
      if (e.target.id === "lb-img") { if (swiped) { swiped = false; return; } zoom(!lb.classList.contains("zoomed"), e); }
      return;
    }
    var t = e.target.closest(".thumb"); if (t && lb) return lbOpen(t.dataset.proof, +t.dataset.i, t);
    var l = e.target.closest("[data-lang]"); if (l) return setLang(l.dataset.lang);
    var c = e.target.closest(".card"); if (c) { seqPos = SEQ.indexOf(c.dataset.id); return openAt(+c.dataset.depth, c.dataset.id); }
    var cr = e.target.closest(".crumb"); if (cr) { seqPos = SEQ.indexOf(cr.dataset.id); path = path.slice(0, +cr.dataset.depth + 1); return render(99); }
    var g = e.target.closest("[data-go]"); if (g) return goTo(g.dataset.go);
    if (e.target.closest("#b-next")) return step(1);
    if (e.target.closest("#b-prev")) return step(-1);
    if (e.target.closest("#b-reset")) return reset();
  });
  document.addEventListener("keydown", function (e) {
    if (lb && lb.open) {  /* Escape closes the screenshot by itself */
      if (e.key === "ArrowRight") { e.preventDefault(); lbShow(lbI + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); lbShow(lbI - 1); }
      return;
    }
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "Escape") reset();
    else if (e.key === "Backspace" && path.length) { e.preventDefault(); path = path.slice(0, -1); render(99); }
  });

  /* ---------- language ---------- */
  function setLang(l) {
    lang = l; D = ALL[l];
    document.documentElement.lang = l;
    document.title = D.ui.title;
    document.getElementById("kicker").textContent = D.ui.kicker;
    document.getElementById("title").textContent = D.ui.title;
    document.getElementById("l-next").textContent = D.ui.next;
    document.getElementById("l-prev").textContent = D.ui.prev;
    document.getElementById("b-reset").textContent = D.ui.reset;
    var rp = document.getElementById("b-repo"); rp.textContent = D.ui.repo + " ↗"; rp.href = D.repo;
    Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === l)); });
    render(99);
  }

  var raf = null;
  function redraw() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }
  window.addEventListener("resize", redraw);
  if (narrow.addEventListener) narrow.addEventListener("change", function () { placePanel(); redraw(); });
  if (window.ResizeObserver) new ResizeObserver(redraw).observe(rowsEl);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
  /* ?lang=en in the address opens the English version (the English README links to it) */
  var q = null;
  try { q = new URLSearchParams(location.search).get("lang"); } catch (e) {}
  setLang(q === "en" || q === "fr" ? q : lang);
})();

</script>
