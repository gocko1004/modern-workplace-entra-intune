<html lang="en">

<meta name="description" content="Goce Petrov&#x27;s Microsoft 365 trial tenant, level by level: Entra ID, Conditional Access, Intune, and the reason behind each part.">

<title>My tenant, level by level</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--f-display:"Switzer",system-ui,-apple-system,"Segoe UI",sans-serif}
.brand h1,.panel h2,.card.root .lb{font-weight:500;letter-spacing:.01em}
/* The drill-down tenant diagram, in the gocepetrov.com system: rows open one level at a time under the box you
   click, lines join the chosen box to its children, and the panel explains the last click. */
:root{
  --bg:#0a0a0a; --surface:#161616; --surface-2:#111111; --raise:#1c1c1c;
  --ink:#f5f5f3; --muted:rgba(255,255,255,.62); --dim:rgba(255,255,255,.5);
  --line:rgba(255,255,255,.14); --line-strong:rgba(255,255,255,.3);
  --accent:#ff5218; --accent-soft:#ffa88c; --ok:#04d939; --lime:#f0ffa3; --sky:#9ad7ff;
  --f-display:"PP Neue Machina","Arial Narrow",Arial,sans-serif;
  --f-body:"Switzer",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --panel-w:390px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font:400 11.5px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{color:var(--accent)}

.app{padding:0 max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.brand{display:grid;gap:2px;margin-right:auto;min-width:0}
.brand h1{margin:0;font:400 clamp(20px,2.4vw,30px)/1.05 var(--f-display);text-transform:uppercase;letter-spacing:-.01em}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;font:500 14px/1 var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--line-strong);border-radius:999px;padding:9px 15px;cursor:pointer;text-decoration:none}
.pill.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.ghost{border-color:var(--line)}
@media (hover:hover){.pill:hover{border-color:var(--ink)}}
.lang{display:inline-flex;gap:2px;border:1px solid var(--line-strong);border-radius:999px;padding:3px}
.lang button{font:500 12px/1 var(--f-mono);letter-spacing:.06em;background:none;border:0;border-radius:999px;padding:7px 10px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 0}
.crumb{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--muted);font:inherit;text-transform:inherit;letter-spacing:inherit}
.crumb[aria-current]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.sep{color:var(--dim)}
.hint{margin-left:auto;color:var(--dim);text-transform:none;letter-spacing:0;font:400 13px/1.3 var(--f-body)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);gap:20px;align-items:start}
@media (max-width:1100px){.stage{grid-template-columns:1fr}}
.tree{position:relative;min-width:0}
.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.wire{fill:none;stroke:var(--line-strong);stroke-width:1.2;opacity:.55}
.wire.on{stroke:var(--accent);opacity:1;stroke-width:1.6}
.rows{position:relative;display:grid;gap:44px;padding:8px 0 20px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;transition:opacity .35s ease,transform .35s ease}
.row.wide{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.row.wide .card{width:auto;grid-template-columns:26px minmax(0,1fr);padding:9px 10px;gap:8px}
.row.wide .card .ic{width:26px;height:26px}
.row.wide .card .meta{grid-column:2;justify-self:start;flex-direction:row;align-items:center;gap:10px}
.row.wide .card .lb{font-size:13.5px}
/* narrower screens: as many columns as fit, never a box under 150px */
@media (max-width:900px){.row.wide{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.row{scroll-margin-top:12px}
.row.enter{opacity:0;transform:translateY(-10px)}

.card{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;
  width:min(232px,100%);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;
  transition:border-color .2s,background-color .2s,transform .2s,opacity .2s}
.card .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line-strong)}
.card .ic svg{width:16px;height:16px}
.card .tx{display:grid;gap:1px;min-width:0}
.card .lb{font:500 14.5px/1.25 var(--f-body);overflow-wrap:break-word}
.card .sb{font:400 10.5px/1.35 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--dim);overflow-wrap:anywhere}
.card .st{justify-self:start;margin-top:4px;font:500 9.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:3px 6px}
.st.on{color:var(--ok)} .st.warn{color:var(--accent-soft)} .st.off{color:var(--dim)}
.card .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.card .kids{color:var(--accent-soft);white-space:nowrap}
.card .pf{display:inline-flex;align-items:center;gap:4px;color:var(--sky);white-space:nowrap}
.card .pf svg{width:13px;height:13px}
.card.lvl{border-color:rgba(255,255,255,.22)}
.card.root{width:min(300px,100%);padding:14px 16px}
.card.root .lb{font:400 19px/1.1 var(--f-display);text-transform:uppercase}
.card.sel{border-color:var(--accent);background:rgba(255,82,24,.08);transform:translateY(-1px)}
.row:has(.card.sel) .card:not(.sel){opacity:.55}
.card.gone{border-style:dashed}
.card.gone .lb{color:var(--muted)}
@media (hover:hover){.card:hover{border-color:var(--ink);opacity:1}}

.panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
@media (max-width:1100px){.panel{position:static;max-height:none} .wires{display:none}}
.panel.inline{border-color:rgba(255,82,24,.45)}
.panel h2{margin:0;font:400 22px/1.1 var(--f-display);text-transform:uppercase}
.p-step{color:var(--ok)}
.p-kind{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:400 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:var(--muted)}
.chip.ok,.chip.on{border-color:var(--ok);color:var(--ok)} .chip.warn{border-color:var(--accent);color:var(--accent-soft)}
.p-sec{display:grid;gap:6px}
.p-sec .mono em{color:var(--accent);font-style:normal;margin-right:6px}
.p-sec p{margin:0;line-height:1.6}
.p-sec ul{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--muted)}
.p-say{border-left:2px solid var(--accent);padding-left:12px;font-size:16px}
.p-gap{border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;color:var(--accent-soft)}
.p-gap p{margin:4px 0 0}
.links{display:grid;gap:6px}
.link{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.link b{font-weight:500;font-size:14px}
.link span{font:400 10.5px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--dim);text-align:right}
.shots{display:grid;gap:4px}
.shot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.shot .sn{font:500 11.5px/1 var(--f-mono);color:var(--accent)}
.shot .sf{font:400 11px/1.35 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.shot::after{content:"↗";font-size:12px;color:var(--dim)}
@media (hover:hover){.link:hover,.shot:hover{border-color:var(--line-strong)}}
@media (max-width:640px){
  .card{width:calc(50% - 6px);grid-template-columns:26px minmax(0,1fr);gap:8px;padding:9px 10px}
  .card .ic{width:26px;height:26px}
  .card .meta{grid-column:2;justify-self:start;flex-direction:row;align-items:center;gap:10px}  /* counts under the text, which keeps the width */
  .card.root{width:100%} .hint{display:none} .rows{gap:34px}
}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* proof: the screenshots behind a box, as thumbnails that open full size */
.proof{display:grid;gap:9px;padding:11px;border:1px solid rgba(154,215,255,.3);border-radius:12px;background:rgba(154,215,255,.04)}
.proof-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--sky)}
.proof-h svg{width:15px;height:15px;flex:none}
.proof-hint{margin-left:auto;color:var(--dim);text-transform:none;letter-spacing:0;font:400 12.5px/1.2 var(--f-body)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{position:relative;display:block;aspect-ratio:16/10;padding:4px;background:#050505;border:1px solid var(--line);border-radius:9px;cursor:zoom-in;overflow:hidden}
.thumb img{display:block;width:100%;height:100%;object-fit:contain}
.thumb .tn{position:absolute;left:5px;bottom:5px;font:500 10px/1 var(--f-mono);color:var(--ink);background:rgba(0,0,0,.8);border:1px solid var(--line);border-radius:6px;padding:3px 5px}
@media (hover:hover){.thumb:hover{border-color:var(--sky)}}

/* the full-size viewer */
html.lb-open{overflow:hidden}
.shotbox{border:0;padding:0;margin:auto;width:min(1400px,calc(100vw - 32px));height:calc(100vh - 32px);height:calc(100dvh - 32px);max-width:none;max-height:none;
  background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.shotbox[open]{display:flex;flex-direction:column}
.shotbox::backdrop{background:rgba(0,0,0,.8)}
.lb-top{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line)}
.lb-step{margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-count{color:var(--accent);white-space:nowrap}
.lb-x{flex:none;width:38px;height:38px;border-radius:999px;border:1px solid var(--line-strong);background:none;cursor:pointer;font-size:15px}
.lb-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;background:#050505;overflow:hidden;touch-action:pan-y pinch-zoom}
.lb-stage img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:6px;cursor:zoom-in;user-select:none;-webkit-user-drag:none;transition:opacity .2s}
.shotbox.fits .lb-stage img{cursor:default}
.shotbox.zoomed .lb-stage{display:block;overflow:auto;touch-action:auto}
.shotbox.zoomed .lb-stage img{max-width:none;max-height:none;margin:0 auto;cursor:zoom-out}
.lb-msg{position:absolute;inset:auto 0 50% 0;text-align:center;pointer-events:none;display:none}
.shotbox.loading .lb-msg,.shotbox.err .lb-msg{display:block}
.shotbox.loading .lb-stage img{opacity:.15}
.shotbox.err .lb-stage img{display:none}
.lb-cap{display:grid;gap:4px;padding:11px 18px;border-top:1px solid var(--line);max-height:30vh;overflow:auto}
.lb-what{margin:0;font-size:15px;line-height:1.45}
.lb-why{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.lb-cap code{font:400 .88em/1 var(--f-mono);background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.lb-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px 12px}
.lb-bar .grow{flex:1}
.lb-bar .pill:disabled{opacity:.35;cursor:default}
@media (max-width:640px){
  .shotbox{width:100vw;height:100vh;height:100dvh;border-radius:0}
  .lb-top{padding:8px 8px 8px 14px}
  .lb-stage{padding:6px}
  .lb-cap{padding:10px 14px;max-height:34vh}
  .lb-bar{padding:8px 8px max(10px,env(safe-area-inset-bottom,0px))}
  .lb-bar .pill{padding:9px 12px}
  .lb-bar .t{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>

<script>
(function () {
  var ALL = {"fr": {"nodes": {"u-admin": {"kind": "user", "label": "Admin quotidien", "sub": "Administrateur général", "what": "Mon compte d'administration de tous les jours, cloud uniquement.", "setup": ["Rôle Administrateur général, attribution directe et permanente.", "Inclus volontairement dans CA001 et CA002 : je ne m'exclus pas de mes propres règles.", "Microsoft Authenticator depuis le 18 octobre, enregistré avec un passe d'accès temporaire délivré par le compte d'urgence."], "why": "L'administration se fait depuis le portable hôte, qui n'est pas inscrit dans Intune : c'est pour ça que la stratégie d'appareil conforme ne le vise pas.", "gap": "Ses anciennes méthodes sont encore enregistrées et pas encore revues, et il n'a pas encore de méthode résistante au phishing.", "state": "GA", "stateK": "warn", "gone": false, "icon": "user"}, "u-emerg": {"kind": "user", "label": "emergency-access-01", "sub": "Compte d'urgence · Administrateur général", "what": "Le compte qui sert quand tout le reste est bloqué. Il n'est rattaché à aucun collaborateur, mais sa clé d'accès est sur mon téléphone, faute de clé FIDO2.", "setup": ["Cloud uniquement, Administrateur général permanent.", "Une clé d'accès liée à l'appareil, dans Authenticator, attestée, méthode préférée du système.", "Le passe temporaire et la méthode notification / code ont été supprimés après l'enregistrement.", "Membre du groupe EmergencyAccess, exclu de toutes les stratégies d'accès conditionnel."], "why": "L'accès conditionnel peut bloquer tous les administrateurs. Le moyen de rentrer passe en premier. Le 18 octobre, il a servi pour de vrai : il a délivré le passe qui a débloqué le compte admin.", "gap": "Un seul compte d'urgence au lieu de deux ; il garde un mot de passe ; aucune alerte sur ses connexions.", "state": "PASSKEY", "stateK": "on", "gone": false, "icon": "user"}, "u-bea": {"kind": "user", "label": "Utilisatrice test", "sub": "lea.test · Business Premium", "what": "Mon utilisatrice standard, pou ergency-access-01 et l'utilisatrice test, qui n'a aucun rôle d'administration. Deux groupes portent le travail : EmergencyAccess porte l'exclusion des trois stratégies d'accès conditionnel, Dyn-Autopilot-Devices reçoit tout ce qu'Intune déploie. Le principe : peu de comptes avec tous les droits, et des affectations par groupe plutôt que par personne, pour qu'un appareil enregistré ou un compte d'urgence hérite de tout en entrant dans le groupe. Les règles se testent sur l'utilisatrice test, jamais sur mon compte d'administration.", "say": "Peu de comptes avec tous les droits, et tout le reste passe par des groupes."}, "cat-users": {"label": "Utilisateurs", "sub": "Admin, urgence, utilisatrice test", "principle": "Trois utilisateurs, trois rôles distincts : l'admin quotidien, Administrateur général soumis à CA001 et CA002 ; emergency-access-01, Administrateur général permanent, qui n'est rattaché à aucun collaborateur et se connecte par clé d'accès ; l'utilisatrice test, licence Business Premium, aucun rôle d'administration. Le principe : on ne teste pas des stratégies sur son compte d'administration, on les teste sur un utilisateur ordinaire. C'est l'utilisatrice test qui a inscrit CORP-97322 par Autopilot, qui est la seule cible de CA003, et dont j'ai désactivé le compte le 21 octobre pour aller lire la cause exacte dans le journal de connexion.", "say": "Je teste mes règles sur une utilisatrice ordinaire, jamais sur mon compte admin."}, "cat-groups": {"label": "Groupes", "sub": "Exclusion et affectation", "principle": "Deux groupes, deux fonctions. EmergencyAccess porte l'exclusion : groupe de sécurité à appartenance attribuée, un seul membre, emergency-access-01, exclu de CA001, CA002 et CA003, et « attribuable à des rôles » dès la création, pour qu'un Administrateur de groupes ne puisse pas s'y ajouter et sortir de toutes les règles. Dyn-Autopilot-Devices porte l'affectation : groupe dynamique sur l'attribut ZTDId, donc un appareil enregistré dans Autopilot y entre tout seul et reçoit le profil Autopilot, la page d'état de l'inscription, CP-Windows, BitLocker, Defender et SmartScreen sans que je touche à rien. Affecter et exclure par groupe plutôt que par personne : ajouter ou retirer un compte, c'est une appartenance qui change, pas trois stratégies à rouvrir.", "say": "Un appareil enregistré entre dans le groupe tout seul et reçoit toute sa configuration."}, "cat-roles": {"label": "Rôles", "sub": "Deux administrateurs généraux", "principle": "Le rôle qui peut tout faire, Administrateur général, a deux titulaires permanents : l'admin quotidien et emergency-access-01, sans PIM ni attribution éligible pour l'instant. Le principe : le moindre privilège, donc peu de comptes avec tous les droits ; Microsoft recommande moins de cinq administrateurs généraux. En phase 1, anna.test gérait les appareils avec le rôle Administrateur Intune, pas Administrateur général : le droit nécessaire, rien de plus.", "say": "Deux administrateurs généraux, dont un qui ne sert qu'en cas d'urgence."}, "b-acc": {"label": "Accès", "sub": "Entra ID", "principle": "D'un côté les méthodes de connexion, clé d'accès, passe d'accès temporaire, Microsoft Authenticator et Windows Hello Entreprise ; de l'autre, trois stratégies d'accès conditionnel, CA001, CA002 et CA003, qui remplacent les paramètres de sécurité par défaut. L'ordre compte : le moyen de rentrer passe avant les règles qui peuvent bloquer, donc la clé d'accès du compte d'urgence a été enregistrée le 17 octobre et les stratégies activées le 18. Les paramètres par défaut sont tout ou rien ; avec Entra ID P1, l'accès conditionnel permet des exceptions propres, comme le groupe d'urgence. Les désactiver au jour 15 avait supprimé la seule exigence MFA du tenant ; CA001 l'a rétablie le 18 octobre.", "say": "J'ai sécurisé l'accès avant de le restreindre."}, "cat-methods": {"label": "Méthodes de connexion", "sub": "Clé d'accès, Authenticator, Hello", "principle": "Quatre méthodes, chacune à sa place : la clé d'accès pour le compte d'urgence, Microsoft Authenticator pour l'admin quotidien, Windows Hello Entreprise pour l'utilisatrice test sur CORP-97322, et le passe d'accès temporaire pour enregistrer tout cela sans mot de passe ; SMS et appel vocal sont désactivés, vérifiés. Le principe : enlever les méthodes faibles et ajouter celles qu'une fausse page ne peut pas relayer, une clé d'accès étant liée au vrai domaine de Microsoft. Conséquence concrète : le jeton obtenu avec Windows Hello porte déjà la MFA, donc CA001 est satisfaite sans nouvelle demande pour l'utilisatrice. Ce qui manque encore : le profil de clés d'accès par défaut reste permissif, et l'admin n'a pas de méthode résistante au phishing.", "say": "J'enlève les méthodes faibles et j'ajoute celles qu'une fausse page ne peut pas relayer."}, "cat-ca": {"label": "Accès conditionnel", "sub": "Trois stratégies actives", "principle": "Trois stratégies, toutes actives depuis le 18 octobre : CA001 exige la MFA pour tous les utilisateurs sur toutes les ressources, CA002 bloque l'authentification héritée, CA003 exige sur Windows un appareil marqué conforme par Intune. CA001 et CA002 visent tous les utilisateurs et excluent le groupe EmergencyAccess ; CA003, elle, vise directement l'utilisatrice test, parce que c'est un lab à une seule utilisatrice et que mon portable d'administration n'est pas inscrit dans Intune ; en production, elle viserait un groupe. Aucune n'a été activée à l'aveugle : rapport uniquement, puis What If, puis une vraie connexion, puis activation. C'est ainsi que What If a montré que CA002 ne s'applique pas à un navigateur, et que le journal du 18 octobre donnait CA001 et CA003 en « Réussite » avant que je les active.", "say": "Je ne mets jamais une stratégie en blocage sans avoir vu qui elle aurait bloqué."}, "b-dev": {"label": "Appareils", "sub": "Intune", "principle": "Un poste géré, CORP-97322 : machine virtuelle Windows 11 Pro sur Hyper-V, démarrage sécurisé et TPM virtuel, jointe à Entra par Autopilot et inscrite dans Intune. Tout ce qu'il reçoit, profil Autopilot, conformité, BitLocker, Defender, SmartScreen, lui arrive par le groupe dynamique Dyn-Autopilot-Devices. Le principe : un vrai cycle de vie piloté par des stratégies, du carton au poste conforme, sans que personne touche à la machine. Le statut conforme qu'Intune écrit est ce que CA003 lit à la connexion ; pare-feu, anneaux de mise à jour et intégrité de la mémoire restent à configurer.", "say": "Un PC sort du carton, l'utilisatrice se connecte, et le poste arrive configuré et conforme."}, "cat-enrol": {"label": "Inscription", "sub": "Autopilot et autorité MDM", "principle": "Deux réglages font entrer un appareil dans Intune : l'inscription automatique, autorité MDM Intune et portée utilisateur All, et le profil Autopilot APUserDrivenEntraJoin, piloté par l'utilisateur, jonction Entra, utilisateur standard, modèle de nom CORP-%RAND:5%, d'où CORP-97322. Le principe : sans inscription, aucune stratégie ne s'applique et l'appareil ne peut pas être conforme ; tout le reste en dépend. Deux pannes documentées le prouvent : 80180003, parce que l'autorité MDM n'avait jamais été définie, et 801C03ED pendant la reconstruction, parce que la jonction Entra était limitée à un groupe dont l'utilisatrice test ne faisait pas partie. Depuis, la jonction est ouverte à tous ; en production, je la limiterais de nouveau à un groupe.", "say": "Sans inscription, aucune stratégie ne s'applique : tout commence ici."}, "cat-policies": {"label": "Stratégies du poste", "sub": "Conformité, chiffrement, antivirus, SmartScreen", "principle": "Quatre stratégies, toutes affectées au groupe Dyn-Autopilot-Devices : CP-Windows, la conformité, qui vérifie BitLocker, démarrage sécurisé, intégrité du code, pare-feu, TPM et Defender ; ES-BitLocker-OS, XTS-AES 256 avec clé de récupération dans Entra ; ES-Defender-AV, 12 paramètres dont la protection en temps réel ; CFG-Edge-SmartScreen, 4 paramètres. Le principe : la sécurité du poste se prouve par la conformité, pas par la confiance, et la conformité est le pont entre Intune et l'accès conditionnel, puisque CA003 lit ce statut. Un appareil sans stratégie de conformité est déclaré non conforme, par réglage du tenant. Sur CORP-97322, la rotation de la clé BitLocker a été testée et la protection contre les falsifications de Defender constatée active.", "say": "La conformité est le pont entre Intune et l'accès conditionnel : CA003 lit ce statut."}, "b-svc": {"label": "Messagerie et services", "sub": "Microsoft 365", "principle": "Ce que les identités et les appareils protègent : Exchange Online, où l'utilisatrice test ouvre Outlook sur le web dans Edge depuis CORP-97322 ; les centres d'administration Entra, Intune, Microsoft 365 et Exchange, que j'utilise depuis le portable hôte ; Defender for Business, inclus dans Business Premium ; et Microsoft Graph, l'API que lit mon script d'audit. Le principe : les règles se jugent là où l'accès se fait, pas sur leur page de configuration. À chaque connexion à Exchange Online, les trois stratégies d'accès conditionnel s'évaluent ; c'est aussi là que les attaques de messagerie se voient, règles de boîte de réception cachées et transferts, que je m'exerce à lire via PowerShell Exchange Online. Dans les centres d'administration, l'admin quotidien passe par CA001 et par la MFA obligatoire de Microsoft, comme tout le monde.", "say": "C'est à la connexion à la messagerie que les règles s'évaluent, et que les attaques se voient."}, "b-ops": {"label": "Contrôle et outils", "sub": "Vérifier, pas supposer", "principle": "Les journaux de connexion et d'audit, mon script identity-audit.ps1 en lecture seule sur Graph, les scripts de reconstruction du poste, le portable hôte et le dépôt GitHub modern-workplace-entra-intune, en anglais et en français. Le principe : vérifier, pas supposer ; un réglage n'est en place que quand une lecture indépendante le confirme. Le script a trouvé ce que What If ne pouvait pas voir, que les stratégies excluaient l'utilisateur d'urgence et non le groupe ; corrigé, puis revérifié par le script. Même réflexe à la démolition : le journal affirmait qu'un réglage était remis par défaut, c'était faux.", "say": "Mon script a trouvé ce que What If ne pouvait pas voir."}, "cat-logs": {"label": "Journaux", "sub": "Connexion et audit", "principle": "Deux journaux : les connexions, interactives et non interactives, qui disent qui, quand, d'où, avec quelle méthode et quelles stratégies ; l'audit, qui dit qui a changé quoi, lectures de clés BitLocker et méthodes MFA enregistrées comprises. Le principe : un contrôle n'existe que s'il laisse une trace ; l'utilisateur dit « ça ne marche pas », le journal dit pourquoi. J'ai lu l'onglet « Rapport uniquement » avant d'activer chaque stratégie, et appris le 18 octobre que les connexions d'Edge sur un PC joint arrivent dans le journal non interactif. Le 21 octobre, compte de l'utilisatrice test désactivé : message vague de son côté, cause exacte dans le journal de connexion ; la revue du journal d'audit reste à faire.", "say": "L'utilisatrice dit « ça ne marche pas » ; le journal dit pourquoi."}, "b-lic": {"label": "Licences", "sub": "Ce qui rend tout ça possible", "principle": "Quatre licences : Business Premium en essai, qui apporte Entra ID P1 et Intune à chaque utilisateur ; Intune Plan 1, une licence payée, valable jusqu'au 20 août 2027 ; Intune Suite, essai de 250 licences, facturation récurrente désactivée dès le premier jour ; Entra ID P2, essai de 100 licences, dont aucune fonction n'est utilisée aujourd'hui. Le principe : les licences décident de ce qui est possible, et je sais ce qui dépend de quoi. L'accès conditionnel, les groupes dynamiques et l'inscription automatique reposent sur le P1 de Business Premium, prolongé une fois jusqu'au 27 octobre et qui ne peut plus l'être ; selon Microsoft, l'accès conditionnel reste alors appliqué mais n'est plus modifiable, et l'effet sur l'inscription est à vérifier. Intune Plan 1 n'inclut pas Entra ID P1 ; la date de fin de l'essai P2 reste à vérifier dans le centre d'administration.", "say": "Les licences décident de ce qui est possible, et je sais ce qui expire quand."}, "b-hist": {"label": "Construit puis démoli", "sub": "Phase 1", "principle": "Ce que la phase 1 a construit entre le 17 août et le 14 septembre, puis démoli : 20 utilisateurs créés par script, dont anna.test avec le rôle Administrateur Intune ; un Android avec profil professionnel ; LAPS Windows ; règles ASR, App Control et Endpoint Privilege Management ; filtres d'affectation ; Microsoft 365 Apps avec remédiations ; et, avant de tout supprimer, un export Microsoft365DSC. Le principe : ce qu'on sait démolir et reconstruire par script, on le maîtrise ; la démolition a commencé par un inventaire et un aperçu sans suppression, puis un script de suppression. Le poste a été reconstruit par scripts PowerShell, VM, image, hachage Autopilot, durcissement ; les stratégies ont été refaites dans le portail. Deux traces restent ouvertes : LAPS supprimé et pas encore recréé, et l'application de l'export DSC, à authentification par certificat, qui existe peut-être encore.", "say": "Ce que je sais reconstruire par script, je le maîtrise."}}, "edges": [{"a": "u-admin", "b": "r-ga", "l": "titulaire", "r": "titulaire"}, {"a": "u-emerg", "b": "r-ga", "l": "titulaire", "r": "titulaire"}, {"a": "u-emerg", "b": "g-emerg", "l": "membre", "r": "membre"}, {"a": "g-emerg", "b": "ca1", "l": "exclu de", "r": "exclut"}, {"a": "g-emerg", "b": "ca2", "l": "exclu de", "r": "exclut"}, {"a": "g-emerg", "b": "ca3", "l": "exclu de", "r": "exclut"}, {"a": "u-emerg", "b": "m-passkey", "l": "se connecte avec", "r": "utilisée par"}, {"a": "m-tap", "b": "m-passkey", "l": "a servi à enregistrer", "r": "enregistrée avec"}, {"a": "u-emerg", "b": "u-admin", "l": "a débloqué (18 oct.)", "r": "débloqué par"}, {"a": "u-admin", "b": "m-auth", "l": "MFA", "r": "utilisé par"}, {"a": "m-tap", "b": "m-auth", "l , "step": "Étape", "of": "sur", "kinds": {"user": "Utilisateur", "group": "Groupe", "role": "Rôle", "policy": "Stratégie", "method": "Méthode d'authentification", "device": "Appareil", "intune": "Intune", "service": "Service", "licence": "Licence", "tool": "Outil", "log": "Journal", "host": "Poste hôte"}, "gone": "Démoli", "start": "Commencer", "intro": "Le tenant se lit de haut en bas : chaque clic ouvre le niveau suivant et explique pourquoi il est construit ainsi. « Suivant » suit l'ordre de la présentation ; Échap replie tout.", "introProof": "L'icône image signale les boîtes prouvées par des captures d'écran du tenant : cliquez sur une capture pour la voir en grand.", "proof": "Preuves", "shot1": "capture", "shotsN": "captures", "enlarge": "Cliquez pour agrandir", "lbPrev": "Précédente", "lbNext": "Suivante", "zoom": "Zoom", "fit": "Ajuster", "orig": "Original sur GitHub", "close": "Fermer", "loading": "Chargement…", "failed": "Image indisponible : ouvrez l'original sur GitHub."}, "repo": "https://github.com/gocko1004/modern-workplace-entra-intune", "shots": {"01": {"step": "Étape 3 · Ne jamais perdre l'accès", "what": "Une connexion authentifiée avec un <b>passe d'accès temporaire<\/b> (Temporary Access Pass)", "why": "Comment un compte sans méthode obtient sa première méthode forte, pour enregistrer une clé d'accès (passkey)", "alt": "Une connexion authentifiée avec un passe d'accès temporaire (Temporary Access Pass)"}, "02": {"step": "Étape 3 · Ne jamais perdre l'accès", "what": "Compte d'urgence avec une seule méthode utilisable, une <b>clé d'accès<\/b> ; méthode préférée par le système Fido2", "why": "<b>Authenticator avait aussi ajouté les notifications push et les codes<\/b>, tous deux vulnérables à l'hameçonnage. Supprimés", "alt": "Compte d'urgence avec une seule méthode utilisable, une clé d'accès ; méthode préférée par le système Fido2"}, "03": {"step": "Étape 3 · Ne jamais perdre l'accès", "what": "L'AAGUID de la clé d'accès", "why": "La valeur que signale Authenticator sur Android. Graph enregistre cette clé d'accès comme attestée ; le profil ne l'exige pas, donc une clé d'accès non attestée aurait aussi été acceptée", "alt": "L'AAGUID de la clé d'accès"}, "04": {"step": "Étape 4 · Les règles d'accès", "what": "Page des stratégies d'accès conditionnel sur son écran Get Started : aucune stratégie", "why": "La stratégie du jour 15 avait disparu après le démontage, et rien ne l'a remplacée", "alt": "Page des stratégies d'accès conditionnel sur son écran Get Started : aucune stratégie"}, "05": {"step": "Étape 4 · Les règles d'accès", "what": "Security defaults sur <b>Disabled<\/b>", "why": "Sans stratégie non plus, <b>rien n'exigeait l'authentification multifacteur (MFA) pour les utilisateurs<\/b>, un mois après que le jour 15 a consigné la lacune", "alt": "Security defaults sur Disabled"}, "06": {"step": "Étape 4 · Les règles d'accès", "what": "« Don't lock yourself out! » avec <b>Exclude current user<\/b> présélectionné", "why": "Le garde-fou de Microsoft, mauvais ici : le compte d'urgence est le garde-fou, et la valeur par défaut exempterait le compte administrateur habituel de la MFA", "alt": "« Don't lock yourself out! » avec Exclude current user présélectionné"}, "07": {"step": "Étape 4 · Les règles d'accès", "what": "Résultat What If pour l'utilisateur de test : CA001 et CA003 s'appliquent, report-only", "why": "Simulé avant que quoi que ce soit soit activé. Les entrées sont listées sur la page", "alt": "Résultat What If pour l'utilisateur de test : CA001 et CA003 s'appliquent, report-only"}, "08": {"step": "Étape 4 · Les règles d'accès", "what": "Résultat What If pour le compte d'urgence : aucune stratégie ne s'applique, raison <b>Users and groups<\/b>", "why": "L'exclusion tient pour les trois stratégies", "alt": "Résultat What If pour le compte d'urgence : aucune stratégie ne s'applique, raison Users and groups"}, "09": {"step": "Étape 4 · Les règles d'accès", "what": "Résultats report-only sur une vraie connexion Microsoft Edge : CA001 et CA003 Success, CA002 Not applied", "why": "<b>Trouvé dans le journal non interactif<\/b>, pas dans l'interactif", "alt": "Résultats report-only sur une vraie connexion Microsoft Edge : CA001 et CA003 Success, CA002 Not applied"}, "10": {"step": "Étape 4 · Les règles d'accès", "what": "CA001, CA002 et CA003, toutes les trois <b>On<\/b>", "why": "Activées seulement après que What If et la connexion en report-only ont concordé", "alt": "CA001, CA002 et CA003, toutes les trois On"}, "11": {"step": "Étape 5 · Le poste de travail", "what": "Choose MDM Authority réglé sur <b>None<\/b>", "why": "<b>Erreur 80180003<\/b>, « not authorized to enroll ». Le tenant n'avait jamais déclaré quel service gère les appareils, donc chaque inscription était refusée. L'erreur accuse l'utilisateur ; l'utilisateur n'a jamais été le problème", "alt": "Choose MDM Authority réglé sur None"}, "12": {"step": "Étape 5 · Le poste de travail", "what": "<code>Dyn-Autopilot-Devices<\/code> avec la VM du lab comme membre", "why": "<b>Le profil est resté Not assigned<\/b> tant qu'il ciblait <code>Dyn-Windows-Devices<\/code> : <code>deviceOSType<\/code> ne correspond qu'aux appareils inscrits. La règle ZTDid correspond dès l'enregistrement", "alt": "Dyn-Autopilot-Devices avec la VM du lab comme membre"}, "13": {"step": "Étape 5 · Le poste de travail", "what": "Profil de déploiement <code>APUserDrivenEntraJoin<\/code> : User-Driven, Microsoft Entra joined", "why": "User-driven parce que le mode self-deploying exige un TPM 2.0 physique", "alt": "Profil de déploiement APUserDrivenEntraJoin : User-Driven, Microsoft Entra joined"}, "14": {"step": "Étape 5 · Le poste de travail", "what": "<code>CORP-97322<\/code> dans le rapport de chiffrement Intune", "why": "Le nom vient du modèle du profil <code>CORP-%RAND:5%<\/code>, preuve que le profil a piloté la configuration", "alt": "CORP-97322 dans le rapport de chiffrement Intune"}, "15": {"step": "Étape 5 · Le poste de travail", "what": "<code>CP-Windows<\/code> par paramètre : neuf paramètres Compliant, 0 Not applicable", "why": "Une ligne Not applicable n'a jamais été vérifiée. Zéro signifie que chaque vérification a réellement tourné", "alt": "CP-Windows par paramètre : neuf paramètres Compliant, 0 Not applicable"}, "16": {"step": "Étape 5 · Le poste de travail", "what": "<code>edge://policy<\/code> : quatre stratégies SmartScreen à true, Platform, Device, Mandatory, OK", "why": "Le commutateur de téléchargement appartient à Edge, donc la stratégie Defender ne pouvait pas le régler", "alt": "edge://policy : quatre stratégies SmartScreen à true, Platform, Device, Mandatory, OK"}, "17": {"step": "Étape 6 · Vérifier, pas supposer", "what": "Audit PowerShell : les trois stratégies excluent l'<b>utilisateur<\/b> Emergency Access 01, aucun groupe", "why": "<b>What If ne pouvait pas montrer cela.<\/b> Le groupe protégé ne faisait rien tant que les stratégies ne le nommaient pas", "alt": "Audit PowerShell : les trois stratégies excluent l'utilisateur Emergency Access 01, aucun groupe"}, "18": {"step": "Étape 6 · Vérifier, pas supposer", "what": "La même vérification après le correctif : les trois excluent le groupe <code>EmergencyAccess<\/code>", "why": "Correctif vérifié par relecture, pas supposé", "alt": "La même vérification après le correctif : les trois excluent le groupe EmergencyAccess"}, "19": {"step": "Étape 6 · Vérifier, pas supposer", "what": "Connexions du compte d'urgence avec la méthode utilisée", "why": "<b>La clé d'accès figure sur l'entrée erreur 50140<\/b>, l'invite « Stay signed in? », pas sur le succès qui la suit", "alt": "Connexions du compte d'urgence avec la méthode utilisée"}, "20": {"step": "Étape 6 · Vérifier, pas supposer", "what": "Connexions de l'utilisateur de test, et inscriptions d'applications détenant des secrets client", "why": "Windows Hello for Business explique le succès report-only de CA001. Aucun secret client sur les inscriptions d'applications", "alt": "Connexions de l'utilisateur de test, et inscriptions d'applications détenant des secrets client"}, "21": {"step": "Étape 6 · Vérifier, pas supposer", "what": "Portail : « You do not have access to view this BitLocker recovery key »", "why": "<b>Mauvaise erreur.<\/b> Le compte était Global Administrator. C'est le panneau du portail qui a échoué, pas la permission", "alt": "Portail : « You do not have access to view this BitLocker recovery key »"}, "22": {"step": "Étape 6 · Vérifier, pas supposer", "what": "Graph Explorer : 403 Forbidden sur <code>recoveryKeys<\/code>", "why": "Graph exige que <code>BitlockerKey.ReadBasic.All<\/code> et <code>BitlockerKey.Read.All<\/code> aient reçu le consentement", "alt": "Graph Explorer : 403 Forbidden sur recoveryKeys"}, "23": {"step": "Étape 6 · Vérifier, pas supposer", "what": "Graph Explorer : 200 OK sur le même point de terminaison", "why": "L'API a renvoyé ce que le portail refusait. L'interface n'est qu'un client de l'API", "alt": "Graph Explorer : 200 OK sur le même point de terminaison"}, "24": {"step": "Étape 6 · Vérifier, pas supposer", "what": "Trois clés de récupération listées pour un seul lecteur", "why": "Pas un défaut. Chaque chiffrement et chaque rotation dépose une nouvelle clé et les anciennes restent, c'est pourquoi l'écran de récupération affiche un Key ID", "alt": "Trois clés de récupération listées pour un seul lecteur"}, "25": {"step": "Étape 6 · Vérifier, pas supposer", "what": "Stratégie antivirus avec <b>PUA Protection off<\/b>", "why": "<b>Valeur non sécurisée appliquée.<\/b> Un « off » explicite écrase l'appareil et se signale quand même comme appliqué. Corrigé en le réglant sur block", "alt": "Stratégie antivirus avec PUA Protection off"}, "26": {"step": "Étape 7 · Démolir et reconstruire", "what": "Stratégie <code>Feature-Pin-24H2<\/code>, colonne Versions <b>Windows 11, version 25H2<\/b>", "why": "<b>Le nom ne correspondait pas au comportement.<\/b> Le nom était une étiquette tapée par un humain ; la colonne Versions est ce que le service fait", "alt": "Stratégie Feature-Pin-24H2, colonne Versions Windows 11, version 25H2"}, "27": {"step": "Étape 7 · Démolir et reconstruire", "what": "Chaque paramètre de fusion listé deux fois en <b>Conflict<\/b>, Default Inbound Action Succeeded", "why": "<b>La stratégie n'a rien fait.<\/b> Un profil plus ancien réglait les commutateurs de fusion sur True, le nouveau sur False, donc Windows n'a appliqué ni l'un ni l'autre. Corrigé en donnant un seul propriétaire au pare-feu", "alt": "Chaque paramètre de fusion listé deux fois en Conflict, Default Inbound Action Succeeded"}, "28": {"step": "Étape 7 · Démolir et reconstruire", "what": "What If : <code>CA-Require-Compliant-Device<\/code> sous Policies that will apply, State Report-only", "why": "Vérifié avec le simulateur plutôt qu'avec une connexion, parce que le compte administrateur est exclu de la stratégie", "alt": "What If : CA-Require-Compliant-Device sous Policies that will apply, State Report-only"}, "29": {"step": "Étape 7 · Démolir et reconstruire", "what": "État d'installation de 7-Zip 26.03 sur l'appareil : Installed sur la VM du lab", "why": "<b>Faux positif d'abord.<\/b> <code>Test-Path<\/code> avait renvoyé True sur le portable, pas sur la VM. Redémarrer l'Intune Management Extension a forcé l'installation", "alt": "État d'installation de 7-Zip 26.03 sur l'appareil : Installed sur la VM du lab"}, "30": {"step": "Étape 7 · Démolir et reconstruire", "what": "Stratégie de protection des applications affectée à <code>Dyn-Windows-Devices<\/code> : 1 devices, 0 users", "why": "<b>Ne protège rien.<\/b> La protection des applications cible les utilisateurs dans les applications, pas les appareils. Réaffectée à <code>All-BYOD<\/code>", "alt": "Stratégie de protection des applications affectée à Dyn-Windows-Devices : 1 devices, 0 users"}}}, "en": {"nodes": {"u-admin": {"kind": "user", "label": "Daily admin", "sub": "Global Administrator", "what": "My everyday admin account, cloud-only.", "setup": ["Global Administrator role, assigned directly and permanently.", "Deliberately included in CA001 and CA002: I do not exclude myself from my own rules.", "Microsoft Authenticator since 18 October, registered with a Temporary Access Pass issued by the emergency account."], "why": "I administer from the host laptop, which is not enrolled in Intune: that is why the compliant-device policy does not target this account.", "gap": "Its older methods are still registered and not yet reviewed, and it has no phishing-resistant method yet.", "state": "GA", "stateK": "warn", "gone": false, "icon": "user"}, "u-emerg": {"kind": "user", "label": "emergency-access-01", "sub": "Emergency account · Global Administrator", "what": "The account for when everything else is locked out. It is not tied to any employee, but its passkey is on my phone, for lack of a FIDO2 security key.", "setup": ["Cloud-only, permanent Global Administrator.", "One device-bound passkey in Authenticator, attested, system-preferred method.", "The Temporary Access Pass and the push notification / code method were deleted after registration.", "Member of the EmergencyAccess group, excluded from every Conditional Access policy."], "why": "Conditional Access can lock every administrator out. The way back in comes first. On 18 October it was used for real: it issued the pass that unlocked the admin account.", "gap": "One emergency account instead of two; it still has a password; no alert on its sign-ins.", "state": "PASSKEY", "stateK": "on", "gone": false, "icon": "user"}, "u-bea": {"kind": "user", "label": "Test user", "sub": "lea.test · Business Premium", "what": "My standard user, to test what an employee actually experiences.", "setup": ["Business Premium licence, no admin role.", "Enrolled CORP-97322 through Autopilot; signs in with Windows Hello for Business.", "The only target of CA003 (compliant device on Windows).", "Used for the support exercises: account disabled and the sign-in log read on 21 October."], "why": "You do not test policies on your admin account: you test them on an ordinary user.", "gap": "", "state": "WHFB", "stateK": "on", "gone": false, "icon": "user"}, "g-emerg": {"kind": "group", "label": "EmergencyAccess", "sub": "Security · role-assignable", "what": "The group that carries the exclusion for the emergency accounts.", "setup": ["Security group, assigned membership, member: emergency-access-01.", "Role-assignable, switched on at creation: only a Global Administrator, a Privileged Role Administrator or an owner can change its members.", "Excluded from CA001, CA002 and CA003."], "why": "Without that option, a Groups Administrator could add themselves to the group and step outside every rule.", "gap": "The group exclusion has not yet been tested by a real sign-in.", "state": "PROTECTED", "stateK": "on", "gone": false, "icon": "group"}, "g-auto": {"kind": "group", "label": "Dyn-Autopilot-Devices", "sub": "Dynamic device group", "what": "The group that receives everything Intune deploys.", "setup": ["Rule: device.devicePhysicalIds -any (_ -startsWith \"[ZTDId]\"), so every device registered in Autopilot.", "Assignments: Autopilot profile, Enrollment Status Page, CP-Windows, BitLocker, Defender, SmartScreen.", "Recreated during the rebuild."], "why": "A registered device lands in the group on its own and receives its configuration without me touching anything.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "group"}, "r-ga": {"kind": "role", "label": "Global Administrator", "sub": "2 holders, permanent", "what": "The role that can do anything in the tenant.", "setup": ["Holders: the daily admin and emergency-access-01.", "No PIM and no eligible assignment for now.", "In phase 1, anna.test held the Intune Administrator role: least privilege for device management."], "why": "Two holders, one of them the emergency account: Microsoft recommends fewer than five Global Administrators.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "role"}, "s-dev": {"kind": "policy", "label": "Device settings", "sub": "Entra join · LAPS", "what": "The Entra settings that decide who can join a device.", "setup": ["\"Users may join devices to Microsoft Entra\": All, since 25 September.", "In phase 1 it was limited to an IT-Admins group: that is what caused error 801C03ED during the rebuild, when lea.test was not in it.", "Entra LAPS enabled on day 9, not re-checked since the rebuild."], "why": "Join was opened up to unblock enrolment during the rebuild.", "gap": "Open to all: in production I would limit it to a group again.", "state": "", "stateK": "", "gone": false, "icon": "policy"}, "m-passkey": {"kind": "method", "label": "Passkey (FIDO2)", "sub": "Default profile · device-bound", "what": "The emergency account's phishing-resistant method.", "setup": ["Passkey profiles enabled; the default profile covers all users.", "It does not enforce attestation, allows device-bound and synced passkeys, with no key restrictions.", "Registered on 17 October with a Temporary Access Pass."], "why": "A passkey is bound to Microsoft's real domain: a fake page cannot relay it.", "gap": "The default profile stays permissive; no hardware key for now.", "state": "", "stateK": "", "gone": false, "icon": "method"}, "m-tap": {"kind": "method", "label": "Temporary Access Pass", "sub": "Enabled for all users", "what": "A time-limited code that lets you register a method without a password.", "setup": ["Enabled for all users.", "17 October: one pass made it possible to register the emergency account's passkey.", "18 October: the emergency account issued a pass to the daily admin, who registered Authenticator.", "An administrator cannot issue one to themselves."], "why": "It is the right way to onboard someone or recover an account: nothing travels by email.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "method"}, "m-auth": {"kind": "method", "label": "Microsoft Authenticator", "sub": "Daily admin", "what": "The daily admin's MFA app.", "setup": ["Registered on 18 October with a Temporary Access Pass.", "SMS and voice call: already disabled, checked."], "why": "From 18 October the admin could once again satisfy the MFA that CA001 requires.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "method"}, "m-whfb": {"kind": "method", "label": "Windows Hello for Business", "sub": "lea.test on CORP-97322", "what": "Sign-in by PIN or biometrics, bound to the PC.", "setup": ["lea.test signs in to Windows with Windows Hello.", "The resulting token already carries the MFA claim: CA001 is satisfied without a new prompt."], "why": "A strong, passwordless sign-in on the workstation: that is what the audit showed on 18 October.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "method"}, "ca1": {"kind": "policy", "label": "CA001 · MFA for all users", "sub": "Conditional Access", "what": "Everyone does MFA, on every resource.", "setup": ["Users: all; excluded: the EmergencyAccess group.", "Resources: all. Control: require multifactor authentication.", "Created in report-only, tested with What If, then a real sign-in, then switched on on 18 October."], "why": "A stolen password is no longer enough to get in.", "gap": "", "state": "ON", "stateK": "on", "gone": false, "icon": "policy"}, "ca2": {"kind": "policy", "label": "CA002 · Block legacy authentication", "sub": "Conditional Access", "what": "Blocks the old protocols that cannot do MFA.", "setup": ["Users: all; excluded: EmergencyAccess.", "Client apps: Exchange ActiveSync and other clients. Control: block access.", "Does not apply to a browser: What If confirmed it."], "why": "Legacy authentication bypasses MFA, so it gets shut.", "gap": "", "state": "ON", "stateK": "on", "gone": false, "icon": "policy"}, "ca3": {"kind": "policy", "label": "CA003 · Compliant device (Windows)", "sub": "Conditional Access", "what": "On Windows, access requires a device that Intune has marked compliant.", "setup": ["Target: lea.test; excluded: EmergencyAccess. Platform: Windows. Resources: all.", "Control: require device to be marked as compliant.", "A first version (day 15, CA-Require-Compliant-Device) had been removed in the teardown."], "why": "It targets lea.test only: applied to everyone, it would block administration from the host laptop, which is not enrolled. I target what I can prove.", "gap": "", "state": "ON", "stateK": "on", "gone": false, "icon": "policy"}, "s-secdef": {"kind": "policy", "label": "Security defaults", "sub": "Replaced by Conditional Access", "what": "Microsoft's free baseline, all or nothing.", "setup": ["Switched off on day 15, when I started Conditional Access.", "The two cannot be on at the same time. Switching them off removed the only MFA requirement; CA001 restored it on 18 October."], "why": "Business Premium brings Entra ID P1: Conditional Access allows clean exceptions, such as the emergency group.", "gap": "", "state": "OFF", "stateK": "off", "gone": false, "icon": "policy"}, "d-vm": {"kind": "device", "label": "CORP-97322", "sub": "Windows 11 Pro · Hyper-V VM", "what": "My managed workstation: a virtual machine on the laptop.", "setup": ["Windows 11 Pro 25H2, generation 2, Secure Boot and virtual TPM.", "Microsoft Entra join through Autopilot (user-driven), enrolled in Intune.", "Marked compliant; BitLocker XTS-AES 256 with the recovery key in Entra, key rotation done.", "Defender Antivirus active, tamper protection on."], "why": "A real device lifecycle: deployment, compliance, encryption, protection, all driven by policy.", "gap": "Firewall, update rings and memory integrity not configured yet; Autopilot to re-check since the TPM was added.", "state": "COMPLIANT", "stateK": "on", "gone": false, "icon": "device"}, "i-ap": {"kind": "intune", "label": "Autopilot · APUserDrivenEntraJoin", "sub": "User-driven · Entra join", "what": "The profile that takes a new PC all the way to the desktop, with nobody touching it.", "setup": ["User-driven mode, Microsoft Entra join, standard user.", "Name template: CORP-%RAND:5%, hence CORP-97322.", "Enrollment Status Page: ESPAutopilot.", "Hardware hash harvested by script during the rebuild."], "why": "A PC comes out of the box, the user signs in, and the workstation arrives configured.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "intune"}, "i-mdm": {"kind": "intune", "label": "Automatic enrolment (MDM)", "sub": "MDM authority: Intune · scope: All", "what": "The setting that makes an Entra-joined device enrol in Intune.", "setup": ["MDM user scope: All.", "MDM authority: Intune. It was not set at first: that was the cause of error 80180003."], "why": "Without enrolment, no policy applies and the device cannot be compliant.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "intune"}, "i-cp": {"kind": "intune", "label": "CP-Windows", "sub": "Compliance policy", "what": "What a PC has to meet to be marked compliant.", "setup": ["Checks: BitLocker, Secure Boot, code integrity, firewall, TPM, antivirus, antispyware, Defender and its real-time protection.", "Action for noncompliance: immediately.", "Tenant setting: a device with no compliance policy is marked non-compliant."], "why": "It is the link between Intune and Conditional Access: CA003 reads this status.", "gap": "", "state": "ACTIVE", "stateK": "on", "gone": false, "icon": "intune"}, "i-bl": {"kind": "intune", "label": "ES-BitLocker-OS", "sub": "Encryption · XTS-AES 256", "what": "Encryption of the system drive.", "setup": ["XTS-AES 256 with a TPM protector.", "Recovery key backed up to Entra, then key rotation tested.", "Re-encrypted during the rebuild, on 5 October."], "why": "A stolen laptop gives up no data. And support can retrieve the key, with every read logged.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "intune"}, "i-av": {"kind": "intune", "label": "ES-Defender-AV", "sub": "Antivirus · 12 settings", "what": "The Microsoft Defender Antivirus raph": {"kind": "service", "label": "Microsoft Graph", "sub": "API", "what": "The API that exposes the whole tenant to scripts.", "setup": ["Read by my audit script, read-only.", "Used to create users in bulk (phase 1) and for the Microsoft365DSC export (before the teardown)."], "why": "What the portal shows one page at a time, Graph returns in one request.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "service"}, "l-bp": {"kind": "licence", "label": "Business Premium", "sub": "Trial · Entra ID P1 + Intune", "what": "The licence that brings Entra ID P1 and Intune to every user.", "setup": ["Extended once, on 25 September, to 27 October; it cannot be extended again.", "The only source of Entra ID P1 if the P2 trial, which includes P1, has ended: to check."], "why": "Conditional Access, dynamic groups and automatic enrolment depend on it.", "gap": "Ends 27 October: according to Microsoft, Conditional Access stays enforced but can no longer be edited; effect on enrolment to check.", "state": "→ 27.10", "stateK": "warn", "gone": false, "icon": "licence"}, "l-ip1": {"kind": "licence", "label": "Intune Plan 1", "sub": "Paid · 1 licence", "what": "One paid Intune licence, as the baseline plan.", "setup": ["Valid to 20 August 2027. Does not include Entra ID P1."], "why": "The minimum needed to keep Intune after the trials.", "gap": "", "state": "→ 08.2027", "stateK": "on", "gone": false, "icon": "licence"}, "l-suite": {"kind": "licence", "label": "Intune Suite", "sub": "Trial · 250 licences", "what": "Intune's advanced add-ons.", "setup": ["250-licence trial, recurring billing switched off from day one.", "Used in phase 1 for Endpoint Privilege Management."], "why": "To practise what is on the MD-102 syllabus without paying.", "gap": "", "state": "→ 15.11", "stateK": "on", "gone": false, "icon": "licence"}, "l-p2": {"kind": "licence", "label": "Entra ID P2", "sub": "Trial · 100 licences", "what": "PIM, access reviews, Identity Protection.", "setup": ["Activ e, "icon": "tool"}, "t-rebuild": {"kind": "tool", "label": "Rebuild scripts", "sub": "VM, image, hash, hardening", "what": "The workstation rebuild as PowerShell scripts.", "setup": ["VM creation, Windows image applied, Autopilot hardware hash harvested, hardening (TPM, Secure Boot), BitLocker and Defender checks.", "Teardown prepared with an inventory and a deletion script, after a Microsoft365DSC export."], "why": "What you can rebuild by script, you actually understand. The teardown started with an inventory and a preview that deleted nothing; one setting recorded as \"returned to default\" was not.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "tool"}, "t-host": {"kind": "host", "label": "Host laptop", "sub": "Hyper-V · admin workstation", "what": "My laptop: it hosts the VM and is where I administer from.", "setup": ["Windows 11 Pro, Hyper-V, the VM runs on it.", "Not enrolled in Intune: that is why CA003 targets lea.test only.", "NordVPN set to manual: it was breaking the Hyper-V switch's DNS."], "why": "A limit I own: my admin workstation is not managed; in production it would be.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "host"}, "t-repo": {"kind": "tool", "label": "GitHub repo", "sub": "modern-workplace-entra-intune", "what": "All the tenant's documentation, in English and in French.", "setup": ["Day-by-day guides, a lab log with every error, its cause and its fix.", "Identity part added on 17 and 18 October, with screenshots and the script."], "why": "Everything I built up to 18 October is documented there.", "gap": "", "state": "", "stateK": "", "gone": false, "icon": "log"}, "h-users": {"kind": "user", "label": "20 users, including anna.test", "sub": "Phase 1 · deleted 14 Sept", "what": "The users from the first phase.", "setup": ["20 users created by script.", "anna.test with the Intune Administrator role: least privilege for managing devices."], "why": "Roles and bulk creation practised, then cleanly deleted.", "gap": "", "state": "", "stateK": "", "gone": true, "icon": "user"}, "h-android": {"kind": "device", "label": "Android phone", "sub": "Work profile · deleted", "what": "An Android phone enrolled with a work profile.", "setup": ["Managed Google Play link; a Business Standard trial taken for the admin's mailbox.", "The enrolment link had expired during the detour: started again cleanly."], "why": "Mobile management, not only Windows.", "gap": "", "state": "", "stateK": "", "gone": true, "icon": "phone"}, "h-laps": {"kind": "intune", "label": "Windows LAPS", "sub": "Phase 1 · policy deleted", "what": "The local administrator password, managed and rotated.", "setup": ["Entra LAPS switch turned on on day 9, Intune account protection policy."], "why": "One unique local admin password per device, rotated, readable by support.", "gap": "Policy deleted in the teardown and not yet recreated.", "state": "", "stateK": "", "gone": true, "icon": "intune"}, "h-asr": {"kind": "intune", "label": "ASR, App Control, EPM", "sub": "Endpoint security", "what": "Attack surface reduction, application control, privilege elevation.", "setup": ["ASR rules, App Control, Endpoint Privilege Management (Intune Suite), security baseline."], "why": "Hardening the workstation beyond antivirus.", "gap": "", "state": "", "stateK": "", "gone": true, "icon": "intune"}, "h-filters": {"kind": "intune", "label": "Assignment filters", "sub": "Day 8", "what": "Assign a policy to a group, filtered by device property.", "setup": ["Filters created and tested on day 8."], "why": "Precise targeting without multiplying groups.", "gap": "", "state": "", "stateK": "", "gone": true, "icon": "intune"}, "h-apps": {"kind": "intune", "label": "Microsoft 365 Apps", "sub": "Apps · remediations", "what": "App deployment.", "setup": ["Word, Excel, PowerPoint and Outlook, 64-bit, Monthly Enterprise Channel.", "Remediation scripts and app protection."], "why": "A useful workstation, not only a secure one.", "gap": "", "state": "", "stateK": "", "gone": true, "icon": "intune"}, "h-dsc": {"kind": "tool", "label": "Microsoft365DSC export", "sub": "Before the teardown", "what": "The Intune configuration exported as code, before deleting everything.", "setup": ["An app with certificate authentication, used for the export."], "why": "Keep an exact record of the configuration before tearing it down.", "gap": "That app may still exist; my script reads only secrets, not certificates.", "state": "", "stateK": "", "gone": true, "icon": "tool"}}, "levels": {"me": {"label": "Me", "sub": "Global Administrator", "principle": "I administer this tenant on my own, with a cloud-only Global Administrator account, from my host laptop. I do not exclude myself from my own rules: that account is included in CA001 and CA002 and does MFA like everyone else. On 18 October it was the emergency account that issued the Temporary Access Pass this account used to register Microsoft Authenticator. Still to do: review its older methods and give it a phishing-resistant one.", "say": "I run this tenant on my own, and I am under my own rules like everyone else."}, "tenant": {"label": "My Microsoft 365 tenant", "sub": "Trial · not production", "principle": "A Microsoft 365 trial tenant I have administered on my own since 17 August, outside production: Entra ID, Intune, Exchange Online, Defender for Business, one managed workstation, CORP-97322, and one test user. I built it, tore it down on 14 September, then rebuilt it, to find out what I actually understand. Today: three Conditional Access policies on, one compliant workstation, and every failure documented on GitHub with the exact error, its cause and its fix.", "say": "Everything you are about to see, I built, tore down and rebuilt myself."}, "b-id": {"label": "Identities", "sub": "Entra ID", "principle": "Three accounts that matter: the daily admin, the emergency account emergency-access-01 and the test user, who holds no admin role. Two groups carry the work: EmergencyAccess carries the exclusion from all three Conditional Access policies, Dyn-Autopilot-Devices receives everything Intune deploys. The principle: few accounts with every right, and assignments by group rather than by person, so a registered device or an emergency account inherits everything by entering the group. Rules are tested on the test user, never on my admin account.", "say": "Few accounts with every right, and everything else goes through groups."}, "cat-users": {"label": "Users", "sub": "Admin, emergency, test user", "principle": "Three users, three distinct roles: the daily admin, a Global Administrator subject to CA001 and CA002; emergency-access-01, a permanent Global Administrator tied to no employee, signing in with a passkey; and the test user, Business Premium licence, no admin role. The principle: you do not test policies on your admin account, you test them on an ordinary user. It is the test user who enrolled CORP-97322 through Autopilot, who is the only target of CA003, and whose account I disabled on 21 October to then read the exact cause in the sign-in log.", "say": "I test my rules on an ordinary user, never on my admin account."}, "cat-groups": {"label": "Groups", "sub": "Exclusion and assignment", "principle": "Two groups, two jobs. EmergencyAccess carries the exclusion: a security group with assigned membership, one member, emergency-access-01, excluded from CA001, CA002 and CA003, and role-assignable from creation, so that a Groups Administrator cannot add themselves to it and step outside every rule. Dyn-Autopilot-Devices carries the assignments: a dynamic group on the ZTDId attribute, so a device registered in Autopilot lands in it on its own and receives the Autopilot profile, the Enrollment Status Page, CP-Windows, BitLocker, Defender and SmartScreen without me touching anything. Assign and exclude by group rather than by person: adding or removing an account is one membership change, not three policies to reopen.", "say": "A registered device lands in the group on its own and picks up its whole configuration."}, "cat-roles": {"label": "Roles", "sub": "Two Global Administrators", "principle": "The role that can do anything, Global Administrator, has two permanent holders: the daily admin and emergency-access-01, with no PIM and no eligible assignment for now. The principle: least privilege, so few accounts with every right; Microsoft recommends fewer than five Global Administrators. In phase 1, anna.test managed devices with the Intune Administrator role, not Global Administrator: the right that was needed, nothing more.", "say": "Two Global Administrators, one of them kept for emergencies only."}, "b-acc": {"label": "Access", "sub": "Entra ID", "principle": "On one side the sign-in methods, passkey, Temporary Access Pass, Microsoft Authenticator and Windows Hello for Business; on the other, three Conditional Access policies, CA001, CA002 and CA003, which replace Security defaults. Order matters: the way back in comes before the rules that can lock you out, so the emergency account's passkey was registered on 17 October and the policies switched on on 18 October. Security defaults are all or nothing; with Entra ID P1, Conditional Access allows clean exceptions, such as the emergency group. Switching them off on day 15 had removed the tenant's only MFA requirement; CA001 restored it on 18 October.", "say": "I secured access before I restricted it."}, "cat-methods": {"label": "Sign-in methods", "sub": "Passkey, Authenticator, Windows Hello", "principle": "Four methods, each in its place: the passkey for the emergency account, Microsoft Authenticator for the daily admin, Windows Hello for Business for the test user on CORP-97322, and the Temporary Access Pass to register all of it without a password; SMS and voice call are disabled, checked. The principle: remove the weak methods and add the ones a fake page cannot relay, a passkey being bound to Microsoft's real domain. Concrete consequence: the token obtained with Windows Hello already carries the MFA claim, so CA001 is satisfied with no new prompt for the test user. Still missing: the default passkey profile stays permissive, and the admin has no phishing-resistant method.", "say": "I remove the weak methods and add the ones a fake page cannot relay."}, "cat-ca": {"label": "Conditional Access", "sub": "Three policies on", "principle": "Three policies, all on since 18 October: CA001 requires MFA for all users on every resource, CA002 blocks legacy authentication, CA003 requires on Windows a device marked compliant by Intune. CA001 and CA002 target all users and exclude the EmergencyAccess group; CA003 targets the test user directly, because this is a one-user lab and my admin laptop is not enrolled in Intune; in production it would target a group. None of them went on blind: report-only, then What If, then a real sign-in, then on. That is how What If showed that CA002 does not apply to a browser, and how the log on 18 October read CA001 and CA003 as \"Success\" before I switched them on.", "say": "I never set a policy to block without first seeing who it would have blocked."}, "b-dev": {"label": "Devices", "sub": "Intune", "principle": "One managed workstation, CORP-97322: a Windows 11 Pro virtual machine on Hyper-V, Secure Boot and virtual TPM, Entra-joined through Autopilot and enrolled in Intune. Everything it receives, Autopilot profile, compliance, BitLocker, Defender, SmartScreen, reaches it through the dynamic group Dyn-Autopilot-Devices. The principle: a real device lifecycle driven by policy, from the box to a compliant workstation, with nobody touching the machine. The compliant status Intune writes is what CA003 reads at sign-in; firewall, update rings and memory integrity are still to configure.", "say": "A PC comes out of the box, the user signs in, and the workstation arrives configured and compliant."}, "cat-enrol": {"label": "Enrolment", "sub": "Autopilot and MDM authority", "principle": "Two settings bring a device into Intune: automatic enrolment, MDM authority Intune and MDM user scope All, and the Autopilot profile APUserDrivenEntraJoin, user-driven, Entra join, standard user, name template CORP-%RAND:5%, hence CORP-97322. The principle: without enrolment no policy applies and the device cannot be compliant; everything else depends on it. Two documented failures prove it: 80180003, because the MDM authority had never been set, and 801C03ED during the rebuild, because Entra join was limited to a group the test user was not in. Join has been open to all since; in production I would limit it to a group again.", "say": "Without enrolment no policy applies, so everything starts here."}, "cat-policies": {"label": "Device policies", "sub": "Compliance, encryption, antivirus, SmartScreen", "principle": "Four policies, all assigned to the Dyn-Autopilot-Devices group: CP-Windows, the compliance policy, which checks BitLocker, Secure Boot, code integrity, firewall, TPM and Defender; ES-BitLocker-OS, XTS-AES 256 with the recovery key in Entra; ES-Defender-AV, 12 settings including real-time protection; CFG-Edge-SmartScreen, 4 settings. The principle: workstation security is proven by compliance, not taken on trust, and compliance is the bridge between Intune and Conditional Access, since CA003 reads that status. A device with no compliance policy is marked non-compliant, by tenant setting. On CORP-97322, BitLocker key rotation has been tested and Defender's tamper protection confirmed on.", "say": "Compliance is the bridge between Intune and Conditional Access: CA003 reads that status."}, "b-svc": {"label": "Mail and services", "sub": "Microsoft 365", "principle": "What the identities and devices protect: Exchange Online, where the test user opens Outlook on the web in Edge from CORP-97322; the Entra, Intune, Microsoft 365 and Exchange admin centers, which I use from the host laptop; Defender for Business, included in Business Premium; and Microsoft Graph, the API my audit script reads. The principle: rules are judged where access happens, not on their configuration page. At every sign-in to Exchange Online all three Conditional Access policies are evaluated; it is also where email attacks show up, hidden inbox rules and forwarding, which I am practising reading through Exchange Online PowerShell. In the admin centers the daily admin goes through CA001 and Microsoft's mandatory MFA, like everyone else.", "say": "It is at the mailbox sign-in that the rules are evaluated, and where attacks show up."}, "b-ops": {"label": "Checks and tools", "sub": "Check, don't assume", "principle": "The sign-in and audit logs, my read-only Graph script identity-audit.ps1, the workstation rebuild scripts, the host laptop and the GitHub repo modern-workplace-entra-intune, in English and in French. The principle: check, don't assume; a setting is only in place once an independent read confirms it. The script found what What If could not see, that the policies excluded the emergency user and not the group; fixed, then re-checked by the script. Same reflex at the teardown: the log claimed a setting had been returned to default, and it was wrong.", "say": "My script found what What If could not see."}, "cat-logs": {"label": "Logs", "sub": "Sign-in and audit", "principle": "Two logs: sign-ins, interactive and non-interactive, which say who, when, from where, with which method and which policies; and audit, which says who changed what, BitLocker key reads and registered MFA methods included. The principle: a control only exists if it leaves a trace; the user says \"it doesn't work\", the log says why. I read the Report-only tab before switching on each policy, and learnt on 18 October that Edge sign-ins on a joined PC land in the non-interactive log. On 21 October, the test user's account disabled: a vague message on her side, the exact cause in the sign-in log; the audit log review is still to do.", "say": "The user says it doesn't work; the log says why."}, "b-lic": {"label": "Licences", "sub": "What makes it all possible", "principle": "Four licences: Business Premium on trial, which brings Entra ID P1 and Intune to every user; Intune Plan 1, one paid licence, valid to 20 August 2027; Intune Suite, a 250-licence trial with recurring billing switched off from day one; Entra ID P2, a 100-licence trial, none of whose features is used today. The principle: licences decide what is possible, and I know what depends on what. Conditional Access, dynamic groups and automatic enrolment rest on the P1 in Business Premium, extended once to 27 October and not extendable again; according to Microsoft, Conditional Access then stays enforced but can no longer be edited, and the effect on enrolment is to check. Intune Plan 1 does not include Entra ID P1; the end date of the P2 trial is still to check in the admin center.", "say": "Licences decide what is possible, and I know what expires when."}, "b-hist": {"label": "Built, then torn down", "sub": "Phase 1", "principle": "What phase 1 built between 17 August and 14 September, then tore down: 20 users created by script, including anna.test with the Intune Administrator role; an Android phone with a work profile; Windows LAPS; ASR rules, App Control and Endpoint Privilege Management; assignment filters; Microsoft 365 Apps with remediations; and, before deleting everything, a Microsoft365DSC export. The principle: what you can tear down and rebuild by script, you actually understand; the teardown started with an inventory and a preview that deleted nothing, then a deletion script. The workstation was rebuilt with PowerShell scripts, VM, image, Autopilot hash, hardening; the policies were redone in the portal. Two threads stay open: LAPS deleted and not yet recreated, and the DSC export's certificate-authenticated app, which may still exist.", "say": "If I can rebuild it by script, I really know it."}}, "edges": [{"a": "u-admin", "b": "r-ga", "l": "holder", "r": "holder"}, {"a":
